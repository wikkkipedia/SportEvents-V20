name: SportEvents quality
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SportEvents.sln
      - name: Verify formatting
        run: dotnet format SportEvents.sln --verify-no-changes --no-restore
      - name: Build Release without warnings
        run: dotnet build SportEvents.sln -c Release --no-restore -warnaserror
      - name: Test and require at least 70% line coverage
        run: dotnet test SportEvents.Tests/SportEvents.Tests.csproj -c Release --no-restore -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:Threshold=70 -p:ThresholdType=line -p:ThresholdStat=total
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportevents-coverage
          path: SportEvents.Tests/coverage.cobertura.xml
          if-no-files-found: warn
